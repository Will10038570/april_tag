services:
  ros2:
    image: ros2_april_tag:v1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: april_tag_serive
    privileged: true
    network_mode: host
    ipc: host
    # Headless variant of docker-compose.yml: no X11 forwarding, so it can be
    # brought up from a plain SSH session (no $DISPLAY / $XAUTHORITY needed).
    # GUI tools (virtual_tracking dashboard, rqt_image_view) will not work;
    # use `headless:=true` for virtual tracking.
    # Same project/service/container name as docker-compose.yml, so
    # `docker compose -f docker_compose_UI_off.yml up -d --force-recreate`
    # replaces the GUI container (and vice versa).
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TZ=Asia/Taipei   # local time for logs (tzdata is in the image)
      # Bind CycloneDDS to the wired NIC (192.168.5.0/24) so it can discover
      # the robot at 192.168.5.10; by default it picks the Wi-Fi interface.
      # presence_required="false": if enP8p1s0 is down/unplugged, skip it and
      # fall back to loopback instead of failing to create the domain.
      # The interface is chosen once at node startup; re-launch after plugging in.
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="${ROS_NETWORK_INTERFACE}"/></Interfaces></General><Discovery><Peers><Peer address="${ROS_PEER_IP}"/></Peers><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>50</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>
    volumes:
      - ..:/mnt/work_space
      - /dev:/dev
    stdin_open: true
    tty: true
    # PID 1: ros_entrypoint.sh sources ROS + workspace, then exec replaces it with the launch
    command: ros2 launch apriltag april_tag.launch.py

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy_container
    env_file: .env   # Grafana Cloud Loki URL / user / token
    environment:
      - TZ=Asia/Taipei
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # root in this container == root on the host daemon; keep it on trusted machines only
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
