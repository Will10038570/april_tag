services:
  ros2:
    image: ros2_april_tag:v1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: april_tag_serive
    privileged: true
    network_mode: host
    ipc: host
    # Headless variant of docker-compose.yml: no X11 forwarding, so it can be
    # brought up from a plain SSH session (no $DISPLAY / $XAUTHORITY needed).
    # GUI tools (virtual_tracking dashboard, rqt_image_view) will not work;
    # use `headless:=true` for virtual tracking.
    # Same project/service/container name as docker-compose.yml, so
    # `docker compose -f docker_compose_UI_off.yml up -d --force-recreate`
    # replaces the GUI container (and vice versa).
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:?set in .ros2_setup}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TZ=Asia/Taipei   # local time for logs (tzdata is in the image)
      # Bind CycloneDDS to the wired NIC ROS_NETWORK_INTERFACE (set in .ros2_setup,
      # currently lan2) and discover the robot via the unicast peer ROS_PEER_IP
      # (currently 192.168.5.10); by default Cyclone picks the Wi-Fi interface.
      # Do NOT add lo here: unicast to the peer would be sent from the lo socket
      # and rejected by the kernel (ddsi_udp_conn_write ... retcode -3).
      # If that interface is down / missing, nodes fail to create the domain
      # (no presence_required="false" fallback is set).
      # The interface is chosen once at node startup; re-launch after plugging in.
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="${ROS_NETWORK_INTERFACE:?set in .ros2_setup}"/></Interfaces></General><Discovery><Peers><Peer address="${ROS_PEER_IP:?set in .ros2_setup}"/></Peers><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>50</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>
    volumes:
      - ..:/mnt/work_space
      - /dev:/dev
    stdin_open: true
    tty: true
    restart: unless-stopped
    # PID 1: ros_entrypoint.sh sources ROS + workspace, then exec replaces it with the launch
    command: ros2 launch apriltag april_tag.launch.py
