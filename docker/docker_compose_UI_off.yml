services:
  ros2:
    image: ros2_april_tag:v1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: april_tag_serive
    privileged: true
    network_mode: host
    ipc: host
    # Headless variant of docker-compose.yml: no X11 forwarding, so it can be
    # brought up from a plain SSH session (no $DISPLAY / $XAUTHORITY needed).
    # GUI tools (virtual_tracking dashboard, rqt_image_view) will not work;
    # use `headless:=true` for virtual tracking.
    # Same project/service/container name as docker-compose.yml, so
    # `docker compose -f docker_compose_UI_off.yml up -d --force-recreate`
    # replaces the GUI container (and vice versa).
    environment:
      - ROS_DOMAIN_ID=63
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Bind CycloneDDS to the wired NIC (192.168.5.0/24) so it can discover
      # the robot at 192.168.5.10; by default it picks the Wi-Fi interface.
      # presence_required="false": if enP8p1s0 is down/unplugged, skip it and
      # fall back to loopback instead of failing to create the domain.
      # The interface is chosen once at node startup; re-launch after plugging in.
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="enP8p1s0"/></Interfaces></General><Discovery><Peers><Peer address="192.168.6.10"/></Peers><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>50</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>
    volumes:
      - ..:/mnt/work_space
      - /dev:/dev
    stdin_open: true
    tty: true
