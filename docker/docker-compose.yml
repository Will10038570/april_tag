services:
  ros2:
    image: ros2_april_tag:v1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: april_tag_serive
    privileged: true
    network_mode: host
    ipc: host
    # NOTE: GUI (X11) forwarding assumes:
    #   1. `docker compose up` is run from a shell inside an active graphical
    #      login session, so $XAUTHORITY/$DISPLAY are set. Over a plain SSH
    #      session with no local desktop, $XAUTHORITY won't exist and this
    #      setup won't work — that needs SSH X11 forwarding instead.
    #   2. The host is running X11 or XWayland. If the host ever moves to
    #      pure Wayland (no XWayland), the /tmp/.X11-unix socket approach
    #      below stops working and must be replaced with a Wayland socket
    #      mount (e.g. $WAYLAND_DISPLAY under $XDG_RUNTIME_DIR).
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      - ROS_DOMAIN_ID=63
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TZ=Asia/Taipei   # local time for logs (tzdata is in the image)
      # All ROS nodes run on this host, so CycloneDDS is bound to loopback only
      # (no robot / 192.168.6.10 peer). lo has no MULTICAST flag, so discovery
      # uses the unicast peer 127.0.0.1; the "lo is not multicast-capable"
      # warning is expected. Works without any network cable plugged in.
      - CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="lo"/></Interfaces></General><Discovery><Peers><Peer address="127.0.0.1"/></Peers><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>50</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>
    volumes:
      - ..:/mnt/work_space
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.docker.xauth:ro
    stdin_open: true
    tty: true
